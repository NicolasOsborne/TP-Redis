version: '3.8'

services:
  # Service de l'application de chat Node.js
  chat-app:
    build: . # Utilise le Dockerfile dans le répertoire courant
    container_name: chat-app
    ports:
      - '3000:3000' # Mappe le port 3000 du conteneur au port 3000 de l'hôte
    depends_on:
      - redis # Assure que Redis démarre avant l'application
    environment:
      # Optionnel: définir l'hôte Redis via une variable d'environnement pour plus de flexibilité
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # Optionnel: Monter le code pour un rechargement à chaud (Hot Reload) en développement
    # volumes:
    #   - .:/usr/src/app
    #   - /usr/src/app/node_modules

  # Service de la base de données Redis (utilise l'image officielle)
  redis:
    image: redis/redis-stack-server:latest
    container_name: chat-redis
    ports:
      - '6379:6379' # Expose le port pour le débogage (optionnel)
    volumes:
      - redis-data:/data # Volume pour persister les données de Redis (même si c'est pour un chat)

# Définition des volumes
volumes:
  redis-data:
    driver: local
