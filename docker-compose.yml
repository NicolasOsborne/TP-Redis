version: '3.8'

services:
  # 1. Instance 1 du serveur de chat (sur le port hôte 3000)
  chat-app-1:
    build: .
    ports:
      - '3000:3000' # Hôte 3000 -> Conteneur 3000
    depends_on:
      - redis
    environment:
      PORT: 3000 # Le port interne à écouter

  # 2. Instance 2 du serveur de chat (sur le port hôte 3001)
  chat-app-2:
    build: .
    ports:
      - '3001:3000' # Hôte 3001 -> Conteneur 3000 (Le conteneur écoute toujours sur 3000)
    depends_on:
      - redis
    environment:
      PORT: 3000 # Le port interne à écouter

  # Service de la base de données Redis
  redis:
    image: redis/redis-stack-server:latest
    container_name: chat-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local
